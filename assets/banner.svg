<text x="58" y="104" class="mono" font-size="16" fill="#5b8cff">// builder log · neural networks from scratch</text>
<text x="54" y="182" class="sans" font-size="80" font-weight="900" letter-spacing="1" fill="url(#name)">SHAYAN UMER</text>
<text x="58" y="226" class="mono" font-size="19" fill="#d7e0ee">No PyTorch. No NumPy. Just math, random, and stubbornness.</text>
<text x="58" y="258" class="mono" font-size="19" fill="#6f84a6">&gt; building AI one neuron at a time<tspan class="cur" fill="#5eead4">▌</tspan></text>
