<style>
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace}
.sans{font-family:"Segoe UI",Inter,"Helvetica Neue",Arial,"DejaVu Sans",sans-serif}
.e{stroke:#22385c;stroke-width:1.4}
.p,.p2{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-dasharray:7 100;stroke-dashoffset:7;animation:fire 3.2s linear infinite}
.p{stroke:#5eead4} .p2{stroke:#f5b544}
@keyframes fire{0%{stroke-dashoffset:7;opacity:0}8%{opacity:1}55%{stroke-dashoffset:-100;opacity:1}56%,100%{stroke-dashoffset:-100;opacity:0}}
.ni,.nh,.no{fill:#0d1626;stroke-width:2} .ni{stroke:#5b8cff} .nh{stroke:#5eead4} .no{stroke:#f5b544}
.core{fill:#e8eef9}
.node{transform-box:fill-box;transform-origin:center;animation:beat 3.2s ease-in-out infinite}
@keyframes beat{0%,100%{opacity:.75}50%{opacity:1}}
.w{fill:#8fa3c4;font-size:13px;opacity:0;animation:tick 6s steps(1) infinite}
.w.b{animation-delay:2s} .w.c{animation-delay:4s}
@keyframes tick{0%{opacity:1}33.3%,100%{opacity:0}}
.cur{animation:blink 1.1s steps(1) infinite}
@keyframes blink{0%{opacity:1}50%,100%{opacity:0}}
.live{animation:live 1.6s ease-in-out infinite}
@keyframes live{0%,100%{opacity:1}50%{opacity:.25}}
.chip{fill:#0f1a2c;stroke:#263e66} .chipt{fill:#b9c7de;font-size:15px}
</style>
