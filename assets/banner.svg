troke-dasharray="2 4"/><text x="814" y="177" class="mono" font-size="14" fill="#a9bad6">05  Classical ML</text></g><g opacity="0.40"><rect x="798" y="122" width="324" height="28" rx="8" fill="#0b1322" stroke="#3a5f9e" stroke-dasharray="2 4"/><text x="814" y="141" class="mono" font-size="14" fill="#a9bad6">06  Neural nets</text></g><g opacity="0.28"><rect x="798" y="86" width="324" height="28" rx="8" fill="#0b1322" stroke="#3a5f9e" stroke-dasharray="2 4"/><text x="814" y="105" class="mono" font-size="14" fill="#a9bad6">07  LLMs &amp; agents</text></g>
