<text x="58" y="226" class="mono" font-size="20" fill="#d7e0ee">AI writes the first draft.</text>
<text x="58" y="256" class="mono" font-size="20" fill="#d7e0ee">I plan it, then rebuild it myself.<tspan class="cur" fill="#5eead4">▌</tspan></text>
