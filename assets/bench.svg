<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" role="img" aria-label="Active bench: a perceptron learning the line that splits AND">
<defs>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 04100V24" fill="none" stroke="#14233b" stroke-width="1"/></pattern>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
<clipPath id="card"><rect width="1200" height="410" rx="20"/></clipPath>
<clipPath id="plot"><rect x="760" y="60" width="300" height="300"/></clipPath></defs>
<style>
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace}
.sans{font-family:"Segoe UI",Inter,"410elvetica Neue",Arial,"DejaVu Sans",sans-serif}

.sweep{animation:sweep 9s cubic-bezier(.6,0,.3,1) infinite}
@keyframes sweep{0%,22%{transform:translate(905px,215px) rotate(12deg)}33%,55%{transform:translate(860px,250px) rotate(-72deg)}66%,100%{transform:translate(965px,155px) rotate(45deg)}}
.half{animation:half 9s ease infinite;opacity:0}
@keyframes half{0%,62%{opacity:0}70%,96%{opacity:1}100%{opacity:0}}
.ep{opacity:0;animation:9s steps(1) infinite}
.ep1{animation-name:e1}.ep2{animation-name:e2}.ep3{animation-name:e3}
@keyframes e1{0%{opacity:1}33%,100%{opacity:0}}
@keyframes e2{0%{opacity:0}33%{opacity:1}66%,100%{opacity:0}}
@keyframes e3{0%{opacity:0}66%{opacity:1}100%{opacity:1}}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}
@keyframes ring{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.6);opacity:0}}
.flow{stroke-dasharray:6 10;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-16}}

</style>
<g clip-path="url(#card)"><rect width="1200" height="410" fill="#0a0f1a"/><rect width="1200" height="410" fill="url(#grid)"/>

<text x="48" y="64" class="mono" font-size="16" fill="#f5b544">01 // ACTIVE BENCH</text>
<text x="46" y="118" class="sans" font-size="46" font-weight="900" fill="#eef3fb">Perceptron</text>
<text x="48" y="154" class="sans" font-size="20" fill="#b9c7de">One neuron learning to draw the line that splits AND.</text>
<g class="mono" font-size="15">
<path d="M104 236 L292 282" stroke="#5b8cff" stroke-width="2.4" fill="none" class="flow"/>
<path d="M104 330 L292 292" stroke="#5b8cff" stroke-width="2.4" fill="none" class="flow"/>
<path d="M330 214 L330 250" stroke="#8fa3c4" stroke-width="2" stroke-dasharray="4 4"/>
<circle cx="84" cy="236" r="20" fill="#0d1626" stroke="#5b8cff" stroke-width="2.4"/><text x="84" y="241" text-anchor="middle" fill="#e8eef9">x₁</text>
<circle cx="84" cy="330" r="20" fill="#0d1626" stroke="#5b8cff" stroke-width="2.4"/><text x="84" y="335" text-anchor="middle" fill="#e8eef9">x₂</text>
<text x="180" y="244" fill="#8fa3c4">× w₁</text><text x="180" y="330" fill="#8fa3c4">× w₂</text>
<text x="330" y="206" text-anchor="middle" fill="#8fa3c4">+ bias</text>
<circle cx="330" cy="287" r="36" fill="#0d1626" stroke="#5eead4" stroke-width="2.6"/>
<text x="330" y="298" text-anchor="middle" font-size="30" fill="#5eead4">Σ</text>
<path d="M366 287 L414 287" stroke="#5eead4" stroke-width="2.4" class="flow"/>
<rect x="414" y="257" width="64" height="60" rx="10" fill="#0d1626" stroke="#5eead4" stroke-width="2.2"/>
<path d="M426 302 H446 V272 H466" fill="none" stroke="#e8eef9" stroke-width="2.6"/>
<path d="M478 287 L520 287" stroke="#f5b544" stroke-width="2.4" class="flow"/>
<text x="530" y="293" fill="#f5b544" font-size="18">0 / 1</text>
<text x="446" y="340" text-anchor="middle" fill="#6f84a6" font-size="12">step</text>
</g>
<text x="48" y="388" class="mono" font-size="14" fill="#6f84a6">status ▸ <tspan fill="#5eead4">predict() ✓</tspan>  <tspan fill="#5eead4">error ✓</tspan>  <tspan fill="#f5b544">weight update ◌</tspan>  <tspan fill="#4f6385">XOR fail ⬚</tspan></text>
<rect x="760" y="60" width="300" height="300" fill="#0b1322" stroke="#22385c"/>
<g clip-path="url(#plot)">
<path d="M760 210 H1060 M910 60 V360" stroke="#16233a"/>
<g class="sweep"><g class="half"><rect x="-400" y="-420" width="800" height="420" fill="#f5b544" fill-opacity=".08"/></g><line x1="-400" y1="0" x2="400" y2="0" stroke="#5eead4" stroke-width="3" opacity=".5" filter="url(#blur)"/><line x1="-400" y1="0" x2="400" y2="0" stroke="#5eead4" stroke-width="2.6"/></g>
<circle cx="800" cy="320" r="12" fill="#0d1626" stroke="#5b8cff" stroke-width="3"/><text x="818" y="354" text-anchor="start" class="mono" font-size="13" fill="#6f84a6">(0,0)</text><circle cx="1020" cy="320" r="12" fill="#0d1626" stroke="#5b8cff" stroke-width="3"/><text x="1002" y="354" text-anchor="end" class="mono" font-size="13" fill="#6f84a6">(1,0)</text><circle cx="800" cy="100" r="12" fill="#0d1626" stroke="#5b8cff" stroke-width="3"/><text x="818" y="78" text-anchor="start" class="mono" font-size="13" fill="#6f84a6">(0,1)</text><circle cx="1020" cy="100" r="13" fill="#f5b544"/><circle cx="1020" cy="100" r="22" fill="none" stroke="#f5b544" stroke-opacity=".35" class="ring"/><text x="1002" y="78" text-anchor="end" class="mono" font-size="13" fill="#6f84a6">(1,1)</text>
</g>
<text x="1076" y="330" class="mono" font-size="13" fill="#4f6385">x₁ →</text>
<text x="770" y="50" class="mono" font-size="13" fill="#4f6385">↑ x₂</text>
<text x="1076" y="96" class="mono ep ep1" font-size="15" fill="#8fa3c4">epoch 1</text><text x="1076" y="118" class="mono ep ep1" font-size="15" fill="#ff7a7a">2 wrong</text>
<text x="1076" y="96" class="mono ep ep2" font-size="15" fill="#8fa3c4">epoch 2</text><text x="1076" y="118" class="mono ep ep2" font-size="15" fill="#febc2e">1 wrong</text>
<text x="1076" y="96" class="mono ep ep3" font-size="15" fill="#8fa3c4">epoch 3</text><text x="1076" y="118" class="mono ep ep3" font-size="15" fill="#5eead4">0 wrong ✓</text>
<text x="1076" y="200" class="mono" font-size="12" fill="#4f6385">● = 1</text><text x="1076" y="220" class="mono" font-size="12" fill="#4f6385">○ = 0</text>
<text x="1060" y="388" text-anchor="end" class="mono" font-size="12" fill="#4f6385">▲ the target behaviour · code ships when it runs</text>

</g><rect x=".5" y=".5" width="1199" height="409" rx="20" fill="none" stroke="#1f3355"/></svg>